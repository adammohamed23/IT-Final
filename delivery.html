    <h2>Delivery address</h2>

    <br />
    <div>
      <fieldset class="nn">
        <legend class="PP">Important Information</legend>
        <form class="mm">
          <div class="input-row">
            <div class="input-group">
              <label for="1" class="ff">Full Name :</label>
              <input
                class="xx"
                id="1"
                type="text"
                required
                placeholder="Enter your name"
              />
            </div>
            <div class="input-group">
              <label for="2" class="ff">Street Address :</label>
              <input
                class="xx"
                type="text"
                id="2"
                required
                placeholder="Enter your address"
              />
            </div>
            <div class="input-group">
              <label for="3" class="ff">City/State :</label>
              <input
                class="xx"
                id="3"
                type="text"
                required
                placeholder=" Enter your city"
              />
            </div>
          </div>
          <br />
          <div class="input-row">
            <div class="input-group">
              <label for="4" class="ff">Zip Code :</label>
              <input
                class="xx"
                id="4"
                type="text"
                placeholder="Enter your zip coda"
              />
            </div>
            <div class="input-group">
              <label for="5" class="ff">Delivery Notes :</label>
              <input
                class="xx"
                id="5"
                type="text"
                placeholder="Remarkable Place"
              />
            </div>
            <div class="input-group">
              <label for="6" class="ff">Phone Number :</label>
              <input
                class="xx"
                id="6"
                type="text"
                required
                placeholder="Please enter your phone number"
              />
            </div>
          </div>
          <br />
          <h1>please enter the payment way</h1>
          <select class="way">
            <option>Cash</option>
            <option>Visa</option>
          </select>
          <br />
          <br />
          <label class="ff" for="8"></label>
          <input class="xy" id="8" type="submit" />
          <br />
        </form>
      </fieldset>
    </div>
    <script src="light-theme.js"></script>
    <script src="cart-badge.js"></script>
  </body>
